<h2>Passwort zurücksetzen</h2>
<p>Über den folgenden Link kannst du ein neues Passwort festlegen. Der Link ist eine Stunde gültig.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/passwort-neu">Neues Passwort festlegen</a></p>
<p>Wenn du das nicht angefordert hast, kannst du diese E-Mail ignorieren. Dein Passwort bleibt unverändert.</p>
